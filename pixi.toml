[workspace]
authors = ["reonokiy <reonokiy@nokiy.net>"]
channels = ["conda-forge"]
name = "ELF"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.10"
setuptools = "==69.5.1"
numpy = ">=1.26.4,<2.0.0"
scipy = ">=1.12.0"
matplotlib = ">=3.8.0"
requests = ">=2.31.0"
tqdm = ">=4.66.0"
pillow = ">=9.5.0"
pyyaml = ">=6.0.1"

[pypi-dependencies]
jax = {version = "==0.4.38", extras = ["tpu"]}
libtpu-nightly = {url = "https://storage.googleapis.com/libtpu-nightly-releases/wheels/libtpu-nightly/libtpu_nightly-0.1.dev20241010+nightly.cleanup-py3-none-any.whl"}
