jaxlib = "==0.4.38"
flax = "==0.10.2"
orbax-checkpoint = "==0.5.23"
optax = ">=0.2.5"
absl-py = ">=1.4.0"
ml-dtypes = ">=0.4.0"
gcsfs = ">=2024.1.0"
datasets = ">=2.19.0"
huggingface-hub = ">=0.23.0"
transformers = ">=4.41.2,<4.45.0"
torch = {url = "https://download.pytorch.org/whl/cu129/torch-2.11.0%2Bcu129-cp312-cp312-manylinux_2_28_x86_64.whl"}
torchvision = {url = "https://download.pytorch.org/whl/cu129/torchvision-0.26.0%2Bcu129-cp312-cp312-manylinux_2_28_x86_64.whl"}
wandb = "==0.16.6"
tensorflow = ">=2.15.0"
einops = ">=0.7.0"
sacrebleu = ">=2.4.0"
rouge-score = ">=0.1.2"
